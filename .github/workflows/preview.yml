name: Preview image

# Every push to a pull request from this repository builds the image and tags it
#   ghcr.io/<owner>/onefrog:preview   (always the most recently pushed PR)
#   ghcr.io/<owner>/onefrog:pr-<N>
# A preview server (see docs/预览服务器.md) pulls :preview every few minutes.
# Release images (:latest, :vX.Y.Z) are untouched.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image
  cancel-in-progress: true

jobs:
  image:
    # Fork PRs get no package write access; only same-repo branches publish.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/onefrog"
          if [ -n "${PR_NUMBER}" ]; then
            label="pr-${PR_NUMBER}"
          else
            label="preview-${GITHUB_SHA::7}"
          fi
          {
            echo "label=${label}"
            echo "tags=${image}:preview,${image}:${label}"
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.label }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
